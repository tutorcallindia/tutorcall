<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Demo – TutorCall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body{
        margin:0;
        font-family:Inter, sans-serif;
        background:#f5f7fa;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }
    .box{
        width:360px;
        background:#fff;
        padding:24px;
        border-radius:12px;
        box-shadow:0 5px 20px #0001;
    }
    h2{margin:0 0 6px}
    .muted{color:#6b7280;font-size:14px;margin-bottom:20px}
    input{
        width:100%;padding:12px;margin-top:10px;border-radius:8px;
        border:1px solid #d1d5db;font-size:15px;
    }
    button{
        width:100%;padding:12px;margin-top:14px;font-size:16px;
        border:none;border-radius:8px;cursor:pointer;background:#0ea5a4;color:#fff;
    }
    .cancel{background:#ccc;color:#000}
    .hidden{display:none}
</style>
</head>
<body>

<div class="box">
    <h2>Book Free Demo</h2>
    <div class="muted">Login with OTP and continue</div>

    <!-- Stage 1 -->
    <div id="stage1">
        <input id="phone" placeholder="Mobile Number (10 digits)">
        <button onclick="sendOTP()">Send OTP</button>
    </div>

    <!-- Stage 2 -->
    <div id="stage2" class="hidden">
        <input id="otp" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify OTP</button>
        <button class="cancel" onclick="resetForm()">Cancel</button>
    </div>

    <!-- Success -->
    <div id="success" class="hidden" style="text-align:center;font-size:15px;color:#10b981;margin-top:15px;">
        Demo booked successfully! Redirecting...
    </div>
</div>

<script>
let CURRENT_OTP = null;

function sendOTP(){
    let num = document.getElementById('phone').value.trim();
    if(!/^[6-9][0-9]{9}$/.test(num)){
        alert('Enter valid 10-digit mobile number');
        return;
    }
    CURRENT_OTP = Math.floor(100000 + Math.random()*900000);
    alert("OTP (demo): " + CURRENT_OTP);
    document.getElementById('stage1').classList.add('hidden');
    document.getElementById('stage2').classList.remove('hidden');
}

function verifyOTP(){
    let entered = document.getElementById('otp').value.trim();
    if(entered == CURRENT_OTP){
        document.getElementById('stage2').classList.add('hidden');
        document.getElementById('success').classList.remove('hidden');
        setTimeout(()=>{
            window.location.href = "teacher-details.html";
        },1500);
    } else {
        alert('Incorrect OTP');
    }
}

function resetForm(){
    document.getElementById('stage2').classList.add('hidden');
    document.getElementById('stage1').classList.remove('hidden');
}
</script>

</body>
</html>
