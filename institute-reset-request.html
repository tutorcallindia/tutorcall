<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Password Reset</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>body{font-family:Inter;background:#f6f9fb;display:flex;align-items:center;justify-content:center;height:100vh;margin:0} .box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 10px 30px}</style>
</head>
<body>
  <div class="box">
    <h3>Reset Password</h3>
    <p class="muted">Enter your institute email to receive reset link</p>
    <input id="email" placeholder="institute@example.com" />
    <div style="margin-top:12px"><button onclick="requestReset()">Send Reset Link</button></div>
    <div id="status" class="muted" style="margin-top:8px"></div>
  </div>

<script>
async function requestReset(){
  const email = document.getElementById('email').value.trim();
  if(!email){ alert('Enter email'); return; }
  document.getElementById('status').textContent = 'Requesting...';
  const res = await fetch('/api/institute/reset/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email })});
  const data = await res.json();
  document.getElementById('status').textContent = data.message || 'Check email (demo)';
}
</script>
</body>
</html>
