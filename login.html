<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Login - TutorCall</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#fff0f7,
#f3e8ff
);

padding:20px;

}

/* MAIN BOX */

.login-box{

width:100%;
max-width:430px;

background:white;

padding:40px;

border-radius:28px;

box-shadow:
0 15px 40px rgba(255,0,140,0.12);

animation:fadeIn 0.5s ease;

}

/* ANIMATION */

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* LOGO */

.logo{

text-align:center;
margin-bottom:15px;

}

.logo img{

width:75px;
border-radius:18px;

}

/* TITLE */

.login-box h1{

text-align:center;

font-size:34px;

margin-bottom:8px;

background:
linear-gradient(
135deg,
#ff4fa3,
#7b5cff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitle{

text-align:center;
color:#666;
margin-bottom:28px;

}

/* FORM */

#loginForm{

display:flex;
flex-direction:column;
gap:18px;

}

/* INPUT BOX */

.input-group{

display:flex;
flex-direction:column;
gap:8px;

}

.input-group label{

font-weight:600;
font-size:14px;
color:#333;

}

#loginForm input{

padding:14px 16px;

border:2px solid #f1d4e6;

border-radius:14px;

font-size:15px;

outline:none;

transition:0.3s;

background:#fffafd;

}

#loginForm input:focus{

border-color:#ff4fa3;

box-shadow:
0 0 0 4px rgba(255,79,163,0.12);

}

/* BUTTON */

#loginForm button{

padding:15px;

border:none;

border-radius:14px;

background:
linear-gradient(
135deg,
#ff4fa3,
#7b5cff
);

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:0.3s;

margin-top:5px;

}

#loginForm button:hover{

transform:translateY(-3px);

box-shadow:
0 10px 20px rgba(255,0,140,0.25);

}

/* EXTRA LINKS */

.extra-links{

margin-top:20px;

display:flex;

justify-content:space-between;

font-size:14px;

}

.extra-links a{

text-decoration:none;

color:#7b5cff;

font-weight:600;

}

/* OTP LOGIN */

.otp-box{

margin-top:25px;

padding-top:20px;

border-top:1px solid #eee;

text-align:center;

}

.otp-box p{

color:#666;
margin-bottom:15px;

}

.otp-btn{

display:inline-block;

padding:12px 20px;

border-radius:12px;

background:#fff0f7;

color:#ff1493;

font-weight:600;

text-decoration:none;

transition:0.3s;

}

.otp-btn:hover{

background:#ffe0f0;

}

/* RESPONSIVE */

@media(max-width:500px){

.login-box{

padding:30px 22px;

}

.login-box h1{

font-size:28px;

}

}

</style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body>

<div class="login-box">

<!-- LOGO -->

<div class="logo">

<img src="logo.png"
alt="TutorCall Logo">

</div>

<!-- TITLE -->

<h1>Student Login</h1>

<div class="subtitle">

Welcome back to TutorCall 🚀

</div>

<!-- LOGIN FORM -->

<form id="loginForm">

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

</div>

<button type="submit">

Login Now

</button>

</form>

<!-- EXTRA LINKS -->

<div class="extra-links">

<a href="#">
Forgot Password?
</a>

<a href="signup.html">
Create Account
</a>

</div>

<!-- OTP LOGIN -->

<div class="otp-box">

<p>
Quick login with OTP
</p>

<a href="#"
class="otp-btn">

Login using OTP

</a>

</div>

</div>

<script>

document
.getElementById("loginForm")

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

const email =
document
.getElementById("email")
.value;

const password =
document
.getElementById("password")
.value;

try{

const response =
await fetch(

"http://127.0.0.1:3000/api/auth/login",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email,
password

})

}

);

const result =
await response.json();

if(result.token){

localStorage.setItem(
"token",
result.token
);

localStorage.setItem(
"user",

JSON.stringify(result.user)
);

alert(
"Login Successful 🚀"
);

window.location.href =
"dashboard.html";

}else{

alert(
result.message
);

}

}catch(error){

console.log(error);

alert(
"Login Failed"
);

}

}

);

</script>

</body>
</html>
