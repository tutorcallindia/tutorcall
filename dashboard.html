<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard - TutorCall</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#fff0f7,
#f3e8ff
);

min-height:100vh;

color:#111827;

}

/* =========================
        HEADER
========================= */

.topbar{

background:white;

padding:18px 40px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 4px 15px rgba(0,0,0,0.05);

position:sticky;

top:0;

z-index:100;

}

.logo{

display:flex;

align-items:center;

gap:12px;

}

.logo img{

width:55px;

border-radius:14px;

}

.logo h2{

font-size:28px;

background:
linear-gradient(
135deg,
#ff4fa3,
#7b5cff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.logout-btn{

padding:12px 20px;

border:none;

border-radius:12px;

background:
linear-gradient(
135deg,
#ff4fa3,
#7b5cff
);

color:white;

font-weight:600;

cursor:pointer;

transition:0.3s;

}

.logout-btn:hover{

transform:translateY(-3px);

box-shadow:
0 10px 20px rgba(255,0,140,0.25);

}

/* =========================
        DASHBOARD
========================= */

.dashboard{

padding:40px;

max-width:1300px;

margin:auto;

}

/* WELCOME */

.welcome-box{

background:white;

padding:35px;

border-radius:28px;

margin-bottom:35px;

box-shadow:
0 12px 30px rgba(255,0,140,0.08);

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:20px;

}

.welcome-left h1{

font-size:42px;

margin-bottom:10px;

}

.welcome-left p{

color:#666;

font-size:16px;

}

/* QUICK STATS */

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:25px;

margin-bottom:40px;

}

.stat-card{

background:white;

padding:28px;

border-radius:24px;

box-shadow:
0 8px 20px rgba(255,0,140,0.08);

transition:0.3s;

}

.stat-card:hover{

transform:translateY(-6px);

}

.stat-card h3{

font-size:16px;

color:#666;

margin-bottom:10px;

}

.stat-card h2{

font-size:38px;

background:
linear-gradient(
135deg,
#ff4fa3,
#7b5cff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/* USER INFO */

.user-box{

background:white;

padding:30px;

border-radius:24px;

margin-bottom:40px;

box-shadow:
0 10px 25px rgba(255,0,140,0.08);

}

.user-box h2{

font-size:30px;

margin-bottom:10px;

}

.user-box p{

margin-bottom:8px;

color:#555;

}

/* BOOK SECTION */

.section-title{

font-size:34px;

margin-bottom:25px;

}

/* GRID */

.book-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));

gap:30px;

}

/* CARD */

.book-card{

background:white;

padding:18px;

border-radius:24px;

box-shadow:
0 10px 25px rgba(255,0,140,0.08);

transition:0.3s;

overflow:hidden;

}

.book-card:hover{

transform:translateY(-8px);

box-shadow:
0 15px 35px rgba(255,0,140,0.15);

}

.book-card img{

width:100%;

height:240px;

object-fit:cover;

border-radius:18px;

}

.book-card h3{

margin:18px 0 12px;

font-size:24px;

}

.book-card p{

margin-bottom:8px;

color:#666;

}

/* DELETE BUTTON */

.delete-btn{

width:100%;

padding:14px;

margin-top:16px;

border:none;

border-radius:14px;

background:#ef4444;

color:white;

font-size:15px;

font-weight:600;

cursor:pointer;

transition:0.3s;

}

.delete-btn:hover{

background:#dc2626;

transform:translateY(-2px);

}

/* EMPTY */

.empty-box{

background:white;

padding:35px;

border-radius:22px;

text-align:center;

color:#666;

box-shadow:
0 8px 20px rgba(0,0,0,0.05);

}

/* RESPONSIVE */

@media(max-width:768px){

.dashboard{

padding:20px;

}

.topbar{

padding:15px 20px;

}

.welcome-left h1{

font-size:32px;

}

.section-title{

font-size:28px;

}

}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">

<img src="logo.png">

<h2>TutorCall</h2>

</div>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

</div>

<!-- DASHBOARD -->

<section class="dashboard">

<!-- WELCOME -->

<div class="welcome-box">
    <div>

<a href="upload-book.html"
class="logout-btn">

+ Upload Book

</a>

</div>

<div class="welcome-left">

<h1>
Welcome Back 👋
</h1>

<p>
Manage your uploaded books and activity here.
</p>

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat-card">

<h3>Total Books</h3>

<h2 id="bookCount">
0
</h2>

</div>

<div class="stat-card">

<h3>Account Type</h3>

<h2 id="roleBox">
User
</h2>

</div>

<div class="stat-card">

<h3>Status</h3>

<h2>
Active
</h2>

</div>

</div>

<!-- USER INFO -->

<div class="user-box"
id="userInfo">

</div>

<!-- BOOK SECTION -->

<h2 class="section-title">

Your Uploaded Books

</h2>

<div class="book-grid"
id="myBooks">

</div>

</section>

<script>

/* USER */

const user =
JSON.parse(
localStorage.getItem("user")
);

if(user){

document
.getElementById("userInfo")
.innerHTML = `

<h2>
${user.name}
</h2>

<p>
📧 ${user.email}
</p>

<p>
👤 Role:
${user.role}
</p>

`;

document
.getElementById("roleBox")
.innerText =
user.role;

}

/* LOAD BOOKS */

async function loadBooks(){

try{

const response =
await fetch(
"http://127.0.0.1:3000/api/books"
);

const books =
await response.json();

const myBooks =
document.getElementById(
"myBooks"
);

document
.getElementById("bookCount")
.innerText =
books.length;

myBooks.innerHTML = "";

/* EMPTY */

if(books.length === 0){

myBooks.innerHTML = `

<div class="empty-box">

No books uploaded yet 📚

</div>

`;

return;

}

books.forEach(book=>{

myBooks.innerHTML += `

<div class="book-card">

<img src="${book.image}">

<h3>
${book.title}
</h3>

<p>
💰 Price:
₹${book.price}
</p>

<p>
📍 ${book.city}
</p>

<button
class="delete-btn"
onclick="deleteBook('${book._id}')">

Delete Book

</button>

</div>

`;

});

}catch(error){

console.log(error);

alert("Books Load Failed");

}

}

loadBooks();

/* DELETE */

async function deleteBook(id){

const confirmDelete =
confirm(
"Delete this book?"
);

if(!confirmDelete){
return;
}

try{

const response =
await fetch(

`http://127.0.0.1:3000/api/books/${id}`,

{
method:"DELETE"
}

);

const result =
await response.json();

alert(result.message);

location.reload();

}catch(error){

console.log(error);

alert("Delete Failed");

}

}

/* LOGOUT */

function logout(){

localStorage.removeItem("token");

localStorage.removeItem("user");

window.location.href =
"login.html";

}

</script>

</body>
</html>
