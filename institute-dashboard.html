<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Institute Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,Arial;background:#f6f8fb;margin:0;padding:20px}
.header{display:flex;gap:12px;align-items:center}
.card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 10px 30px rgba(10,20,40,0.04)}
.container{max-width:1000px;margin:18px auto;display:grid;grid-template-columns:280px 1fr;gap:12px}
.logout{margin-left:auto;background:#ef4444;color:#fff;padding:8px 10px;border-radius:8px;border:none;cursor:pointer}
</style>
</head>
<body>
  <div class="container">
    <div>
      <div class="card" id="profileCard">
        <h3 id="instName">—</h3>
        <div id="instEmail" class="muted"></div>
        <div id="instStatus" class="muted" style="margin-top:8px"></div>
        <button class="logout" onclick="logout()">Logout</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Dashboard</h2>
        <div id="dashboardContent" class="muted">Loading...</div>
      </div>
    </div>
  </div>

<script>
async function loadProfile(){
  const token = localStorage.getItem('inst_token');
  if(!token){ location.href='institute-login.html'; return; }
  try{
    const res = await fetch('/api/institute/me',{ headers:{ Authorization: 'Bearer '+token }});
    if(res.status===401){ localStorage.removeItem('inst_token'); location.href='institute-login.html'; return; }
    const data = await res.json();
    document.getElementById('instName').textContent = data.name || 'Institute';
    document.getElementById('instEmail').textContent = data.email || '';
    document.getElementById('instStatus').textContent = data.status ? 'Status: '+data.status : '';
    document.getElementById('dashboardContent').textContent = 'Welcome! Manage your institute details, gallery & subscriptions from admin panel (demo).';
  }catch(err){
    console.error(err); location.href='institute-login.html';
  }
}
function logout(){ localStorage.removeItem('inst_token'); window.location.href='institute-login.html'; }
loadProfile();
</script>
</body>
</html>
