<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login - TutorCall</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 30px;
    }

    .container {
      width: 350px;
      max-width: 90%;
      background: white;
      padding: 25px;
      margin: 40px auto;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 6px;
      background: #2196F3;
      cursor: pointer;
    }

    button:hover {
      background: #1976D2;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 10px;
      text-align: center;
      color: red;
      font-size: 14px;
    }

    .link {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .link a {
      color: #2196F3;
      text-decoration: none;
    }

    #otpSection {
      display: none;
    }

    #recaptcha-container {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Student Login</h2>

  <div class="msg" id="msg"></div>

  <!-- PHONE SECTION -->
  <div id="phoneSection">

    <input
      type="tel"
      id="phone"
      placeholder="Enter 10 digit mobile number"
      maxlength="10"
    >

    <div id="recaptcha-container"></div>

    <button id="sendOtpBtn">
      Send OTP
    </button>

  </div>


  <!-- OTP SECTION -->
  <div id="otpSection">

    <input
      type="text"
      id="otp"
      placeholder="Enter 6 digit OTP"
      maxlength="6"
    >

    <button id="verifyOtpBtn">
      Verify OTP & Login
    </button>

  </div>


  <div class="link">
    <a href="student-register-test.html">
      New Student Register?
    </a>
  </div>

</div>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-auth-compat.js"></script>


<script>

  // ================================
  // FIREBASE CONFIG
  // ================================

  const firebaseConfig = {
    apiKey: "AIzaSyDhz8zisR0m01UuFcatuOoSuSWM7eHcyTg",
    authDomain: "tutorcall-8ffad.firebaseapp.com",
    projectId: "tutorcall-8ffad",
    storageBucket: "tutorcall-8ffad.firebasestorage.app",
    messagingSenderId: "1092526942662",
    appId: "1:1092526942662:web:05a498f6a02d911ae9eac7"
  };


  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();


  // ================================
  // ELEMENTS
  // ================================

  const phoneSection = document.getElementById("phoneSection");
  const otpSection = document.getElementById("otpSection");

  const phoneInput = document.getElementById("phone");
  const otpInput = document.getElementById("otp");

  const sendOtpBtn = document.getElementById("sendOtpBtn");
  const verifyOtpBtn = document.getElementById("verifyOtpBtn");

  const msg = document.getElementById("msg");


  // ================================
  // RECAPTCHA
  // ================================

  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
    "recaptcha-container",
    {
      size: "normal",

      callback: function(response) {
        console.log("reCAPTCHA verified");
      },

      "expired-callback": function() {
        msg.style.color = "red";
        msg.innerHTML = "reCAPTCHA expired. Please verify again.";
      }
    }
  );


  // ================================
  // SEND OTP
  // ================================

  sendOtpBtn.addEventListener("click", async function() {

    const phone = phoneInput.value.trim();

    if (!/^[0-9]{10}$/.test(phone)) {

      msg.style.color = "red";
      msg.innerHTML = "Please enter a valid 10 digit mobile number.";

      return;
    }


    const fullPhoneNumber = "+91" + phone;


    msg.style.color = "#333";
    msg.innerHTML = "Sending OTP...";

    sendOtpBtn.disabled = true;


    try {

      const appVerifier = window.recaptchaVerifier;


      window.confirmationResult =
        await auth.signInWithPhoneNumber(
          fullPhoneNumber,
          appVerifier
        );


      msg.style.color = "green";
      msg.innerHTML =
        "OTP sent successfully. Please enter the OTP.";

      phoneSection.style.display = "none";
      otpSection.style.display = "block";


    } catch (error) {

      console.error(error);

      msg.style.color = "red";

      msg.innerHTML =
        error.message || "Unable to send OTP.";

      sendOtpBtn.disabled = false;

      // Reset reCAPTCHA
      if (window.recaptchaVerifier) {
        window.recaptchaVerifier.clear();
      }

      window.recaptchaVerifier =
        new firebase.auth.RecaptchaVerifier(
          "recaptcha-container",
          {
            size: "normal"
          }
        );
    }

  });


  // ================================
  // VERIFY OTP
  // ================================

  verifyOtpBtn.addEventListener("click", async function() {

    const otp = otpInput.value.trim();

    if (!/^[0-9]{6}$/.test(otp)) {

      msg.style.color = "red";
      msg.innerHTML = "Please enter the 6 digit OTP.";

      return;
    }


    msg.style.color = "#333";
    msg.innerHTML = "Verifying OTP...";

    verifyOtpBtn.disabled = true;


    try {

      // Firebase OTP verification
      const result =
        await window.confirmationResult.confirm(otp);


      // Get Firebase ID token
      const firebaseToken =
        await result.user.getIdToken();


      msg.innerHTML =
        "Phone verified. Logging in...";


      // Send Firebase token to TutorCall backend
      const res = await fetch(
       "https://tutorcall.co.in/api/students/firebase-login",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            firebaseToken: firebaseToken
          })
        }
      );


      const data = await res.json();


      if (!data.success) {

        msg.style.color = "red";

        msg.innerHTML =
          data.message || "Login failed.";

        verifyOtpBtn.disabled = false;

        return;
      }


      // ================================
      // SAVE TUTORCALL LOGIN
      // ================================

      localStorage.setItem(
        "studentToken",
        data.token
      );


      localStorage.setItem(
        "studentInfo",
        JSON.stringify(data.student)
      );


      localStorage.setItem(
        "studentId",
        data.student._id
      );


      msg.style.color = "green";

      msg.innerHTML =
        "Login successful. Redirecting...";


      setTimeout(function() {

        window.location.href =
          "/routes/student-dashboard.html";

      }, 1000);


    } catch (error) {

      console.error(error);

      msg.style.color = "red";

      msg.innerHTML =
        error.message || "Invalid OTP.";

      verifyOtpBtn.disabled = false;
    }

  });

</script>

</body>
</html>
