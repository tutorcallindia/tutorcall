<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout - TutorCall</title>

<link rel="stylesheet"
href="style.css">

<style>

body{

  background:#fff5fa;

  font-family:Poppins,sans-serif;

}

/* ===============================
            WRAPPER
================================ */

.checkout-wrapper{

  max-width:1200px;

  margin:50px auto;

  display:grid;

  grid-template-columns:
  1fr 400px;

  gap:35px;

  padding:20px;

}

/* ===============================
            LEFT
================================ */

.checkout-form{

  background:white;

  padding:35px;

  border-radius:28px;

  box-shadow:
  0 10px 35px rgba(255,0,140,0.08);

}

.checkout-form h2{

  font-size:38px;

  margin-bottom:25px;

  color:#111827;

}

.form-group{

  margin-bottom:22px;

}

.form-group label{

  display:block;

  margin-bottom:10px;

  font-weight:600;

  color:#333;

}

.form-group input,
.form-group textarea{

  width:100%;

  padding:16px;

  border-radius:16px;

  border:1px solid #ffd6ea;

  background:#fffafd;

  font-size:16px;

}

.form-group textarea{

  resize:none;

  height:120px;

}

/* ===============================
            RIGHT
================================ */

.order-summary{

  background:white;

  padding:30px;

  border-radius:28px;

  box-shadow:
  0 10px 35px rgba(255,0,140,0.08);

  height:fit-content;

}

.order-summary h3{

  font-size:30px;

  margin-bottom:25px;

}

.summary-card{

  display:flex;

  gap:15px;

  margin-bottom:20px;

  padding-bottom:20px;

  border-bottom:1px solid #eee;

}

.summary-card img{

  width:90px;

  height:110px;

  object-fit:cover;

  border-radius:14px;

}

.summary-info h4{

  font-size:18px;

  margin-bottom:8px;

}

.summary-info p{

  color:#666;

}

.total{

  font-size:30px;

  font-weight:700;

  color:#ff1493;

  margin-top:25px;

}

/* ===============================
            BUTTON
================================ */

.pay-btn{

  width:100%;

  margin-top:25px;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff4fa3,
    #7b5cff
  );

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:0.3s;

}

.pay-btn:hover{

  transform:translateY(-4px);

  box-shadow:
  0 12px 25px rgba(255,0,140,0.25);

}

/* ===============================
          RESPONSIVE
================================ */

@media(max-width:900px){

.checkout-wrapper{

  grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="checkout-wrapper">

<!-- ================= LEFT ================= -->

<div class="checkout-form">

<h2>Checkout</h2>

<div class="form-group">

<label>Full Name</label>

<input type="text"
placeholder="Enter full name">

</div>

<div class="form-group">

<label>Phone Number</label>

<input type="text"
placeholder="Enter mobile number">

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email"
placeholder="Enter email">

</div>

<div class="form-group">

<label>Delivery Address</label>

<textarea
placeholder="Enter complete address">
</textarea>

</div>

<button class="pay-btn">

Proceed To Payment

</button>

</div>

<!-- ================= RIGHT ================= -->

<div class="order-summary">

<h3>Order Summary</h3>

<div id="summaryContainer">

</div>

<div class="total"
id="totalPrice">

Total: ₹0

</div>

</div>

</div>

<script>

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const summaryContainer =
document.getElementById(
"summaryContainer"
);

let total = 0;

cart.forEach(book=>{

total += Number(book.price);

summaryContainer.innerHTML += `

<div class="summary-card">

<img src="${book.image}">

<div class="summary-info">

<h4>
${book.title}
</h4>

<p>
₹${book.price}
</p>

<p>
${book.city}
</p>

</div>

</div>

`;

});

document
.getElementById("totalPrice")
.innerText =
"Total: ₹" + total;

</script>

</body>
</html>
