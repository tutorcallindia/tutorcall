<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tutor Login</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-auth-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f8, #f3efff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .login-box {
      width: 420px;
      max-width: 100%;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    h2 {
      text-align: center;
      margin: 0 0 8px;
      color: #c84ed0;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #f5b7dc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #9b5cff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      background: linear-gradient(90deg, #f542a7, #7954ff);
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    #recaptcha-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    .otp-info {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 15px;
      line-height: 1.5;
    }

    #msg {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
    }

    .resend-btn {
      background: #6655e8;
    }

    .back-btn {
      background: #777;
    }

    .success-box {
      text-align: center;
      color: green;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h2>Tutor Login</h2>

    <div class="subtitle">
      Login securely using mobile OTP
    </div>

    <!-- PHONE -->
    <div id="phoneSection">

      <label for="phone">
        Mobile Number
      </label>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="Enter 10 digit mobile number"
      />

      <button
        type="button"
        id="sendOtpBtn"
      >
        Send OTP
      </button>

      <div id="recaptcha-container"></div>

    </div>


    <!-- OTP -->
    <div id="otpSection" class="hidden">

      <div class="otp-info">
        OTP has been sent to your mobile number.
      </div>

      <label for="otpCode">
        Enter OTP
      </label>

      <input
        id="otpCode"
        type="tel"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6 digit OTP"
      />

      <button
        type="button"
        id="verifyOtpBtn"
      >
        Verify OTP
      </button>

      <button
        type="button"
        id="resendOtpBtn"
        class="resend-btn"
      >
        Resend OTP
      </button>

    </div>


    <div id="msg"></div>

    <button
      type="button"
      class="back-btn"
      onclick="window.location.href='tutor-register.html'"
    >
      ← Back to Registration
    </button>

  </div>


  <script src="tutor-login.js"></script>

</body>

</html>
