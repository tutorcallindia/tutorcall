<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Upload Book - TutorCall</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

background:
linear-gradient(
135deg,
#fff0f7,
#f3e8ff
);

padding:30px;

}

/* CONTAINER */

.upload-container{

max-width:700px;

margin:auto;

background:white;

padding:40px;

border-radius:28px;

box-shadow:
0 15px 40px rgba(255,0,140,0.12);

}

/* TITLE */

.upload-title{

text-align:center;

margin-bottom:30px;

}

.upload-title h1{

font-size:38px;

background:
linear-gradient(
135deg,
#ff4fa3,
#7b5cff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

margin-bottom:10px;

}

.upload-title p{

color:#666;

}

/* FORM */

#uploadForm{

display:flex;

flex-direction:column;

gap:20px;

}

/* INPUT GROUP */

.input-group{

display:flex;

flex-direction:column;

gap:8px;

}

.input-group label{

font-weight:600;

color:#333;

}

#uploadForm input,
#uploadForm textarea,
#uploadForm select{

padding:15px;

border-radius:14px;

border:2px solid #f1d4e6;

outline:none;

font-size:15px;

transition:0.3s;

background:#fffafd;

}

#uploadForm input:focus,
#uploadForm textarea:focus,
#uploadForm select:focus{

border-color:#ff4fa3;

box-shadow:
0 0 0 4px rgba(255,79,163,0.12);

}

/* TEXTAREA */

textarea{

resize:none;

height:120px;

}

/* IMAGE PREVIEW */

.preview-box{

width:100%;

height:240px;

border-radius:20px;

overflow:hidden;

background:#f9f9f9;

display:flex;

justify-content:center;

align-items:center;

border:2px dashed #ffb6d9;

}

.preview-box img{

width:100%;

height:100%;

object-fit:cover;

display:none;

}

/* BUTTON */

.upload-btn{

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#ff4fa3,
#7b5cff
);

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:0.3s;

}

.upload-btn:hover{

transform:translateY(-3px);

box-shadow:
0 10px 20px rgba(255,0,140,0.25);

}

/* RESPONSIVE */

@media(max-width:768px){

.upload-container{

padding:25px;

}

.upload-title h1{

font-size:30px;

}

}
/* IMAGE PREVIEW */

.preview-image{

  width:100%;

  height:100px;

  object-fit:cover;

  border-radius:14px;

  margin-top:15px;

  border:2px solid #ffd3e6;

  background:white;

}

/* FORM BOX */

.upload-box{

  background:white;

  padding:40px;

  border-radius:28px;

  box-shadow:0 10px 35px rgba(255,0,140,0.08);

  border:1px solid #ffd6ea;

}

/* INPUT DESIGN */

.upload-box input,
.upload-box textarea,
.upload-box select{

  width:100%;

  padding:15px;

  border-radius:14px;

  border:2px solid #ffe1ef;

  background:#fffafd;

  font-size:15px;

  transition:0.3s;

}

.upload-box input:focus,
.upload-box textarea:focus,
.upload-box select:focus{

  outline:none;

  border-color:#ff4fa3;

  box-shadow:0 0 10px rgba(255,0,140,0.12);

}

/* BUTTON */

.upload-btn{

  width:100%;

  padding:14px;

  border:none;

  border-radius:14px;

  background:linear-gradient(
    135deg,
    #ff4fa3,
    #7b5cff
  );

  color:white;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

  margin-top:15px;

  transition:0.3s;

}

.upload-btn:hover{

  transform:translateY(-2px);

  box-shadow:0 8px 18px rgba(255,0,140,0.25);

}
/* INPUTS */

.upload-box input,
.upload-box textarea,
.upload-box select{

  width:100%;

  padding:12px;

  margin-top:10px;

  border-radius:12px;

  border:1.5px solid #ffd6ea;

  background:white;

  font-size:15px;

}

/* FORM CONTAINER */

.upload-box{

  background:white;

  padding:28px;

  border-radius:24px;

  box-shadow:0 8px 25px rgba(255,0,140,0.08);

  border:1px solid #ffe0ef;

}
</style>

</head>

<body>

<div class="upload-container">

<!-- TITLE -->

<div class="upload-title">

<h1>
Upload Your Book 📚
</h1>

<p>
Sell your old books easily on TutorCall
</p>

</div>

<!-- FORM -->

<form id="uploadForm">

<!-- BOOK TITLE -->

<div class="input-group">

<label>
Book Title
</label>

<input
type="text"
id="title"
placeholder="Enter book title"
required>

</div>

<!-- PRICE -->

<div class="input-group">

<label>
Price
</label>

<input
type="number"
id="price"
placeholder="Enter price"
required>

</div>

<!-- CITY -->

<div class="input-group">

<label>
City
</label>

<input
type="text"
id="city"
placeholder="Enter city"
required>

</div>

<!-- CATEGORY -->

<div class="input-group">

<label>
Category
</label>

<select id="category">

<option>
School
</option>

<option>
JEE
</option>

<option>
NEET
</option>

<option>
College
</option>

</select>

</div>

<!-- DESCRIPTION -->

<div class="input-group">

<label>
Description
</label>

<textarea
id="description"
placeholder="Write about the book..."></textarea>

</div>

<!-- IMAGE -->

<div class="input-group">

<label>
Upload Image
</label>

<input
type="file"
id="image"
accept="image/*">

</div>

<!-- PREVIEW -->

<div class="preview-box">

<img
id="preview"
class="preview-image"
>
</div>

<!-- BUTTON -->

<button
class="upload-btn"
type="submit">

  Upload Book

</button>
</form>

</div>

<script>

/* IMAGE PREVIEW */

const imageInput =
document.getElementById("image");

const previewImage =
document.getElementById("previewImage");

imageInput.addEventListener("change",(e)=>{

const file =
e.target.files[0];

if(file){

previewImage.src =
URL.createObjectURL(file);

previewImage.style.display =
"block";

}

});

/* FORM SUBMIT */

document
.getElementById("uploadForm")

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

/* FORM DATA */

const formData =
new FormData();

formData.append(

"title",

document
.getElementById("title")
.value

);

formData.append(

"price",

document
.getElementById("price")
.value

);

formData.append(

"city",

document
.getElementById("city")
.value

);

formData.append(

"category",

document
.getElementById("category")
.value

);

formData.append(

"description",

document
.getElementById("description")
.value

);

formData.append(

"image",

document
.getElementById("image")
.files[0]

);

try{

const response =
await fetch(

"http://127.0.0.1:3000/api/books/add",

{

method:"POST",

body:formData

}

);

const result =
await response.json();

alert(
result.message
);

/* REDIRECT */

window.location.href =
"dashboard.html";

}catch(error){

console.log(error);

alert(
"Upload Failed"
);

}

}

);





</script>

</body>
</html>
