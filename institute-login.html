<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Institute Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#eefbfa,#ffffff);margin:0;padding:28px;display:flex;justify-content:center;align-items:center;height:100vh}
  .box{width:420px;background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(6,16,32,0.06)}
  h1{color:#0ea5a4;margin:0 0 8px}
  label{display:block;margin-top:12px;font-weight:600}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef6}
  .row{display:flex;gap:10px;align-items:center;margin-top:14px}
  .btn{background:#0ea5a4;border:0;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
  .muted{color:#6b7280;font-size:13px}
  a{color:#0ea5a4;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <h1>Institute Login</h1>
    <p class="muted">Enter credentials to access your dashboard</p>

    <label>Email</label>
    <input id="email" type="email" />

    <label>Password</label>
    <input id="password" type="password" />

    <div class="row">
      <button class="btn" id="loginBtn">Login</button>
      <div style="margin-left:auto">
        <a href="institute-reset-request.html">Forgot password?</a>
      </div>
    </div>

    <div style="margin-top:12px" class="muted">
      New? <a href="institute-register.html">Create Institute Account</a>
    </div>

    <div id="loginStatus" class="muted" style="margin-top:12px"></div>
  </div>

<script>
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  if(!email || !pass){ alert('Fill fields'); return; }
  document.getElementById('loginStatus').textContent = 'Logging in...';
  try{
    const res = await fetch('/api/institute/login', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || 'Login failed');
    // store token
    localStorage.setItem('inst_token', data.token);
    // redirect to dashboard
    window.location.href = 'institute-dashboard.html';
  }catch(err){
    document.getElementById('loginStatus').textContent = err.message;
  }
});
</script>
</body>
</html>
