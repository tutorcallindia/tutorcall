<!DOCTYPE html>
<html>

<head>

  <title>
    TutorCall Auth Test
  </title>

  <style>

    body {

      background: #0f172a;
      color: white;
      font-family: Arial;
      padding: 40px;
    }

    input {

      display: block;
      width: 300px;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {

      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      background: #10b981;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #result {

      margin-top: 30px;
      background: #1e293b;
      padding: 20px;
      border-radius: 14px;
      white-space: pre-wrap;
    }

  </style>

</head>

<body>

  <h1>
    TutorCall Auth Test
  </h1>

  <input
    type="text"
    id="name"
    placeholder="Name"
  />

  <input
    type="email"
    id="email"
    placeholder="Email"
  />

  <button id="registerBtn">
    Register User
  </button>

  <div id="result">

  </div>

  <script>

    const registerBtn =

      document.getElementById(
        "registerBtn"
      );

    const result =
      document.getElementById(
        "result"
      );

    registerBtn.onclick =
      async () => {

      const name =
        document.getElementById(
          "name"
        ).value;

      const email =
        document.getElementById(
          "email"
        ).value;

      const response =
        await fetch(

          "http://localhost:8000/api/users/register",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              name,
              email
            })
          }
        );

      const data =
        await response.json();

      console.log(data);

      result.innerHTML =
JSON.stringify(
  data,
  null,
  2
);
    };

  </script>

</body>

</html>
