<!DOCTYPE html>
<html>

<head>

  <title>TutorCall AI Tutor</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      background:
      linear-gradient(
      to bottom right,
      #020617,
      #0f172a
      );

      font-family:Arial;
      color:white;
      min-height:100vh;
    }

    .container{

      width:90%;
      max-width:1100px;
      margin:auto;
      padding-top:30px;
      padding-bottom:40px;
    }

    h1{

      text-align:center;
      font-size:52px;
      margin-bottom:25px;
    }

    .avatar-container{

      display:flex;
      justify-content:center;
      margin-bottom:20px;
    }

    .avatar{

      width:180px;
      height:180px;
      border-radius:50%;
      background:#1e293b;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:100px;

      box-shadow:
      0 0 40px
      rgba(16,185,129,0.5);

      animation:pulse 2s infinite;
    }

    @keyframes pulse{

      0%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.06);
      }

      100%{
        transform:scale(1);
      }
    }

    .wave-container{

      display:flex;
      justify-content:center;
      gap:8px;
      margin-bottom:25px;
    }

    .wave{

      width:8px;
      height:40px;
      background:#10b981;
      border-radius:10px;

      animation:wave 1s infinite;
    }

    .wave:nth-child(2){
      animation-delay:0.1s;
    }

    .wave:nth-child(3){
      animation-delay:0.2s;
    }

    .wave:nth-child(4){
      animation-delay:0.3s;
    }

    .wave:nth-child(5){
      animation-delay:0.4s;
    }

    @keyframes wave{

      0%{
        transform:scaleY(1);
      }

      50%{
        transform:scaleY(2.3);
      }

      100%{
        transform:scaleY(1);
      }
    }

    .top-bar{

      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:15px;

      margin-bottom:25px;
    }

    select{

      padding:14px;
      border:none;
      border-radius:12px;
      min-width:190px;
      font-size:17px;
    }

    button{

      padding:15px 28px;
      border:none;
      border-radius:14px;

      color:white;
      font-size:20px;
      font-weight:bold;

      cursor:pointer;
    }

    #startBtn{
      background:#10b981;
    }

    #stopBtn{
      background:#ef4444;
    }

    #status{

      text-align:center;
      font-size:30px;
      margin-bottom:15px;
    }

    #timer{

      text-align:center;
      color:#facc15;
      font-size:26px;
      margin-bottom:20px;
    }

    .chat-box{

      background:#1e293b;
      border-radius:20px;

      height:500px;
      overflow-y:auto;

      padding:20px;
    }

    .message{

      padding:16px;
      border-radius:16px;
      margin-bottom:16px;
      max-width:75%;
      line-height:1.7;
      font-size:18px;
    }

    .user{

      background:#2563eb;
      margin-left:auto;
    }

    .ai{

      background:#334155;
      margin-right:auto;
    }

  </style>

</head>

<body>

<div class="container">

<h1>
🎤 TutorCall AI Tutor
</h1>

<div class="avatar-container">

<div
class="avatar"
id="avatar"
>
👩
</div>

</div>

<div class="wave-container">

<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

</div>

<div class="top-bar">

<select id="languageSelect">

<option>English</option>
<option>Hindi</option>
<option>Marathi</option>
<option>Tamil</option>

</select>

<select id="modeSelect">

<option value="general">
General Conversation
</option>

<option value="interview">
Interview Practice
</option>

</select>

<select id="characterSelect">

<option value="female">
👩 Female Tutor
</option>

<option value="male">
👨 Male Tutor
</option>

</select>

<button id="startBtn">
Start Voice
</button>

<button id="stopBtn">
Stop Voice
</button>

</div>

<div id="status">
🔴 Disconnected
</div>

<div id="timer">
Remaining Minutes: 60m 0s
</div>

<div
class="chat-box"
id="chatBox"
>

</div>

</div>

<script>

let socket;

let recognition;

let remainingSeconds = 3600;

const statusEl =
document.getElementById(
"status"
);

const timerEl =
document.getElementById(
"timer"
);

const chatBox =
document.getElementById(
"chatBox"
);

const avatar =
document.getElementById(
"avatar"
);

const languageSelect =
document.getElementById(
"languageSelect"
);

const modeSelect =
document.getElementById(
"modeSelect"
);

const characterSelect =
document.getElementById(
"characterSelect"
);

function updateTimer(){

const mins =
Math.floor(
remainingSeconds / 60
);

const secs =
remainingSeconds % 60;

timerEl.innerHTML =

`Remaining Minutes:
${mins}m ${secs}s`;

}

setInterval(()=>{

if(
remainingSeconds > 0
){

remainingSeconds--;

updateTimer();

}

},1000);

updateTimer();

function appendMessage(
text,
sender="ai"
){

const div =
document.createElement(
"div"
);

div.classList.add(
"message"
);

div.classList.add(
sender
);

div.innerText = text;

chatBox.appendChild(
div
);

chatBox.scrollTop =
chatBox.scrollHeight;

}

function speakAI(text){

const utterance =
new SpeechSynthesisUtterance(
text
);

speechSynthesis.speak(
utterance
);

}

function connectAI(){

const token =
localStorage.getItem(
"token"
);

socket =
new WebSocket(

`ws://localhost:8000/live-tutor?token=${token}`

);

socket.onopen = ()=>{

statusEl.innerHTML =
"🟢 Connected";

appendMessage(
"✅ AI Connected"
);

startSpeechRecognition();

};

socket.onmessage =
(event)=>{

const data =
JSON.parse(
event.data
);

if(
data.type ===
"AI_RESPONSE"
){

const aiText =
data.message || "Hello";

appendMessage(
`🤖 AI:
${aiText}`,
"ai"
);

speakAI(
aiText
);

}

};

socket.onclose = ()=>{

statusEl.innerHTML =
"🔴 Disconnected";

appendMessage(
"❌ AI Disconnected"
);

};

}

function startSpeechRecognition(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

appendMessage(
"❌ Speech Recognition Not Supported"
);

return;
}

recognition =
new SpeechRecognition();

recognition.continuous = false;
recognition.interimResults = false;
recognition.maxAlternatives = 1;

recognition.lang = "en-US";

recognition.onstart = ()=>{

console.log(
"Speech Recognition Active"
);

appendMessage(
"🎤 Listening..."
);

};

recognition.onerror = (event)=>{

console.log(
"Speech Error:",
event.error
);

appendMessage(
`❌ Mic Error:
${event.error}`
);

};

recognition.onend = ()=>{

console.log(
"Recognition Ended"
);

};

recognition.onresult = (event)=>{

const transcript =
event.results[0][0].transcript;

appendMessage(
`🧑 You:
${transcript}`,
"user"
);

if(
socket &&
socket.readyState === 1
){

socket.send(
JSON.stringify({

type:
"USER_MESSAGE",

message:
transcript,

language:
languageSelect.value,

mode:
modeSelect.value,

character:
characterSelect.value

})
);

}

};

recognition.start();

appendMessage(
"🎤 Microphone Started"
);

}
document
.getElementById(
"startBtn"
)

.addEventListener(
"click",

()=>{

const selected =
characterSelect.value;

if(
selected ===
"female"
){

avatar.innerHTML =
"👩";

}
else{

avatar.innerHTML =
"👨";

}

connectAI();

});

document
.getElementById(
"stopBtn"
)

.addEventListener(
"click",

()=>{

if(socket){

socket.close();

}

if(recognition){

recognition.stop();

}

speechSynthesis.cancel();

statusEl.innerHTML =
"🔴 Disconnected";

});

</script>

</body>

</html>
