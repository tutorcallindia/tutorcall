<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Old Books Marketplace - TutorCall</title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="container nav">

    <div class="brand">

      <div class="logo">
        <img src="logo.png">
      </div>

      <div>

        <h1>TutorCall</h1>

        <div class="tagline">
          Buy & Sell Old Books
        </div>

      </div>

    </div>

    <nav class="menu">

      <a href="index.html">
        Home
      </a>

      <a href="#">
        Marketplace
      </a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>
      <a href="cart.html">
Cart 🛒
</a>

    </nav>

  </div>

</header>

<!-- ================= HERO ================= -->

<section class="market-hero">

  <div class="hero-overlay">

    <h2>Old Books Marketplace</h2>

    <p>
      Buy & Sell NCERT, ICSE, JEE, NEET & Competitive Books
    </p>

  </div>

</section>

<!-- ================= SEARCH ================= -->

<section class="market-search container">

  <input type="text"
         placeholder="Search books, classes, exams...">

  <button class="btn">
    Search
  </button>

</section>

<!-- ================= SELL BANNER ================= -->

<div class="container sell-banner">

  <h3>
    Want to sell your old books?
  </h3>

  <button class="btn"
          onclick="location.href='sell-book.html'">

    Sell Old Books

  </button>

</div>

<!-- ================= DYNAMIC BOOK GRID ================= -->

<section class="book-grid container"
         id="booksContainer">

</section>

<!-- ================= JS ================= -->

<script src="marketplace.js"></script>

</body>
</html>
